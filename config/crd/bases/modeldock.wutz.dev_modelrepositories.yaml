---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelrepositories.modeldock.wutz.dev
spec:
  group: modeldock.wutz.dev
  names:
    kind: ModelRepository
    listKind: ModelRepositoryList
    plural: modelrepositories
    shortNames:
    - mrepo
    singular: modelrepository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.visibility
      name: Visibility
      type: string
    - jsonPath: .status.ociRepository
      name: OCI Repository
      type: string
    - jsonPath: .status.artifactCount
      name: Artifacts
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelRepository is the Schema for the modelrepositories API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelRepositorySpec defines the desired state of ModelRepository.
            properties:
              autoWarmupStages:
                description: AutoWarmupStages lists artifact stages that automatically
                  trigger ModelCache creation.
                items:
                  description: ArtifactStage defines the lifecycle promotion stage
                    of a ModelArtifact.
                  enum:
                  - Staging
                  - Verified
                  - Production
                  - Deprecated
                  - Archived
                  type: string
                type: array
              category:
                default: LLM
                description: Category classifies the model family.
                enum:
                - LLM
                - VLM
                - Embedding
                - Reranker
                - Audio
                - Custom
                type: string
              description:
                description: Description explains the purpose and lineage of models
                  stored in this repository.
                type: string
              displayName:
                description: DisplayName is a human-friendly title for the repository.
                type: string
              harbor:
                description: Harbor defines the underlying Harbor project and repository
                  mapping.
                properties:
                  instanceRef:
                    default: default-harbor
                    description: InstanceRef references the platform Harbor instance
                      configuration Secret/ConfigMap name.
                    type: string
                  projectOverride:
                    description: ProjectOverride overrides the Harbor project name.
                      Only permitted in modeldock-public.
                    type: string
                  repositoryName:
                    description: RepositoryName overrides the Harbor repository name
                      inside the project. Defaults to metadata.name.
                    type: string
                  storageLimitBytes:
                    description: StorageLimitBytes configures Harbor project storage
                      quota in bytes (-1 for unlimited).
                    format: int64
                    type: integer
                type: object
              retentionPolicy:
                description: RetentionPolicy governs automatic cleanup of old Staging
                  artifacts.
                properties:
                  keepLastStagingVersions:
                    default: 5
                    description: KeepLastStagingVersions retains at most N Staging
                      artifacts ordered by creation time.
                    format: int32
                    minimum: 0
                    type: integer
                  untaggedGarbageCollectDays:
                    default: 3
                    description: UntaggedGarbageCollectDays sets the retention window
                      for untagged Harbor manifests.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              sharedNamespaces:
                description: SharedNamespaces lists consumer namespaces permitted
                  when visibility is WorkspaceShared.
                items:
                  type: string
                type: array
              visibility:
                default: Private
                description: Visibility controls cross-namespace access permissions.
                enum:
                - Private
                - WorkspaceShared
                - Public
                type: string
            type: object
          status:
            description: ModelRepositoryStatus defines the observed state of ModelRepository.
            properties:
              artifactCount:
                description: ArtifactCount tracks active ModelArtifacts associated
                  with this repository.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the current state of the ModelRepository
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              harborProjectID:
                description: HarborProjectID is the numeric Harbor Project ID.
                format: int64
                type: integer
              lastCredentialRotationTime:
                description: LastCredentialRotationTime records when pull/push Robot
                  credentials were last rotated.
                format: date-time
                type: string
              latestProductionArtifact:
                description: LatestProductionArtifact records the most recently promoted
                  Production ModelArtifact name.
                type: string
              ociRepository:
                description: OCIRepository is the full OCI repository URI (e.g. harbor.example.com/models-acme/finance-qwen3-lora).
                type: string
              phase:
                description: Phase summarizes repository reconciliation health.
                enum:
                - Pending
                - Ready
                - Error
                type: string
              pullSecretName:
                description: PullSecretName is the K8s Secret containing read-only
                  Harbor Robot credentials.
                type: string
              pushSecretName:
                description: PushSecretName is the K8s Secret containing pull+push
                  (no delete) Harbor Robot credentials.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
