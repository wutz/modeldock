---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelexports.modeldock.wutz.dev
spec:
  group: modeldock.wutz.dev
  names:
    kind: ModelExport
    listKind: ModelExportList
    plural: modelexports
    shortNames:
    - mexp
    singular: modelexport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.artifactType
      name: Type
      type: string
    - jsonPath: .spec.targetRepository
      name: Repository
      type: string
    - jsonPath: .status.bytesTransferred
      name: Bytes
      type: integer
    - jsonPath: .status.artifactName
      name: Artifact
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelExport is the Schema for the modelexports API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelExportSpec defines the desired state of ModelExport.
            properties:
              allowUnsafeFormats:
                description: AllowUnsafeFormats permits exporting pickle-based files
                  (.bin/.pt/.pth).
                type: boolean
              artifactType:
                default: FullWeight
                description: ArtifactType classifies the exported artifact.
                enum:
                - FullWeight
                - LoRAAdapter
                - DraftModel
                type: string
              baseModelRef:
                description: BaseModelRef is required when ArtifactType is LoRAAdapter
                  or DraftModel.
                properties:
                  name:
                    description: Name of the referenced ModelArtifact.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the referenced ModelArtifact. Defaults
                      to the referencing object's namespace if empty.
                    type: string
                  ociDigest:
                    description: OCIDigest optionally pins the exact immutable manifest
                      digest of the referenced artifact.
                    type: string
                required:
                - name
                type: object
              chunkSizeBytes:
                description: ChunkSizeBytes splits any single weight file exceeding
                  this size into virtual chunked OCI layers (0 disables splitting).
                format: int64
                type: integer
              concurrency:
                default: 4
                description: Concurrency controls bounded worker concurrency for shard
                  hashing and upload.
                format: int32
                maximum: 32
                minimum: 1
                type: integer
              includeTrainingStates:
                description: IncludeTrainingStates disables default filtering of optimizer/rng
                  checkpoint files.
                type: boolean
              initialStage:
                default: Staging
                description: InitialStage defines the initial lifecycle stage for
                  the generated ModelArtifact.
                enum:
                - Staging
                - Verified
                - Production
                - Deprecated
                - Archived
                type: string
              lineage:
                description: Lineage injects training or external provenance into
                  the resulting ModelArtifact.
                properties:
                  evaluations:
                    description: Evaluations stores benchmark evaluation scores used
                      for promotion gates.
                    items:
                      description: EvaluationRecord captures benchmark evaluation
                        results attached to an artifact.
                      properties:
                        benchmark:
                          type: string
                        evaluatedAt:
                          format: date-time
                          type: string
                        reportURI:
                          type: string
                        score:
                          type: string
                      required:
                      - benchmark
                      - score
                      type: object
                    type: array
                  externalRevision:
                    description: ExternalRevision captures the resolved upstream commit
                      SHA or external OCI reference.
                    type: string
                  parentArtifactRef:
                    description: ParentArtifactRef links to the parent model artifact
                      (e.g. SFT checkpoint or base model).
                    properties:
                      name:
                        description: Name of the referenced ModelArtifact.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the referenced ModelArtifact. Defaults
                          to the referencing object's namespace if empty.
                        type: string
                      ociDigest:
                        description: OCIDigest optionally pins the exact immutable
                          manifest digest of the referenced artifact.
                        type: string
                    required:
                    - name
                    type: object
                  sourceType:
                    description: SourceType identifies how this model was produced.
                    enum:
                    - TrainTask
                    - DevBox
                    - HuggingFace
                    - ModelScope
                    - Quantization
                    - ExternalOCI
                    type: string
                  trainTaskRef:
                    description: TrainTaskRef links to the originating TrainPilot
                      task.
                    properties:
                      globalStep:
                        format: int64
                        type: integer
                      name:
                        type: string
                      namespace:
                        type: string
                      runID:
                        type: string
                      taskID:
                        type: string
                    type: object
                type: object
              source:
                description: Source defines where weights are streamed from.
                properties:
                  devBoxSource:
                    description: DevBoxSource exports model snapshots from an interactive
                      DevPilot workspace PVC.
                    properties:
                      claimName:
                        description: ClaimName is the DevBox workspace PVC name.
                        minLength: 1
                        type: string
                      excludePatterns:
                        description: ExcludePatterns excludes matching files.
                        items:
                          type: string
                        type: array
                      podName:
                        description: PodName optionally records the DevBox pod name
                          for provenance.
                        type: string
                      subPath:
                        description: SubPath specifies the model directory inside
                          the DevBox PVC.
                        type: string
                    required:
                    - claimName
                    type: object
                  externalHubSource:
                    description: ExternalHubSource streams model weights from HuggingFace
                      or ModelScope into Harbor.
                    properties:
                      authSecretRef:
                        description: AuthSecretRef optionally references a Secret
                          containing a "token" key for gated repos.
                        type: string
                      endpointMirror:
                        description: EndpointMirror optionally specifies a mirror
                          base URL (e.g. https://hf-mirror.com).
                        type: string
                      excludePatterns:
                        description: ExcludePatterns excludes matching files from
                          relay.
                        items:
                          type: string
                        type: array
                      includePatterns:
                        description: IncludePatterns optionally restricts downloaded
                          files by glob patterns.
                        items:
                          type: string
                        type: array
                      provider:
                        description: Provider specifies HuggingFace or ModelScope.
                        enum:
                        - HuggingFace
                        - ModelScope
                        type: string
                      repoID:
                        description: RepoID is the upstream model repository ID (e.g.
                          "Qwen/Qwen3-32B").
                        minLength: 1
                        type: string
                      revision:
                        description: Revision locks a branch, tag, or commit SHA (defaults
                          to "main" or "master").
                        type: string
                    required:
                    - provider
                    - repoID
                    type: object
                  pvcSource:
                    description: PVCSource exports model weights directly from a Kubernetes
                      PersistentVolumeClaim.
                    properties:
                      claimName:
                        description: ClaimName is the PVC name in the same namespace.
                        minLength: 1
                        type: string
                      excludePatterns:
                        description: ExcludePatterns excludes matching files (in addition
                          to default training state filters).
                        items:
                          type: string
                        type: array
                      includePatterns:
                        description: IncludePatterns optionally restricts exported
                          files by glob patterns.
                        items:
                          type: string
                        type: array
                      subPath:
                        description: SubPath specifies the subdirectory inside the
                          PVC containing the checkpoint/model.
                        type: string
                    required:
                    - claimName
                    type: object
                type: object
              targetRepository:
                description: TargetRepository names the target ModelRepository in
                  the same namespace.
                minLength: 1
                type: string
              ttlSecondsAfterFinished:
                default: 86400
                description: TTLSecondsAfterFinished configures automatic Job/export
                  cleanup TTL.
                format: int32
                type: integer
              versionTag:
                description: VersionTag assigns the semantic version tag in Harbor
                  and the resulting ModelArtifact.
                minLength: 1
                type: string
            required:
            - source
            - targetRepository
            - versionTag
            type: object
          status:
            description: ModelExportStatus defines the observed state of ModelExport.
            properties:
              artifactName:
                description: ArtifactName records the name of the created ModelArtifact.
                type: string
              bytesTransferred:
                description: BytesTransferred records total uploaded bytes.
                format: int64
                type: integer
              completionTime:
                description: CompletionTime records when export finished.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the current state of the ModelExport
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              exportedDigest:
                description: ExportedDigest records the resulting OCI manifest digest.
                type: string
              jobName:
                description: JobName records the backing Kubernetes Job name.
                type: string
              message:
                description: Message provides human-readable progress or failure details.
                type: string
              phase:
                description: Phase tracks export pipeline execution state.
                enum:
                - Pending
                - Validating
                - Pushing
                - Succeeded
                - Failed
                type: string
              startTime:
                description: StartTime records when export execution began.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
