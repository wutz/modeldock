---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-modeldock-wutz-dev-v1alpha1-modelartifact
  failurePolicy: Fail
  name: mmodelartifact-v1alpha1.kb.io
  rules:
  - apiGroups:
    - modeldock.wutz.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modelartifacts
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-modeldock-wutz-dev-v1alpha1-modelexport
  failurePolicy: Fail
  name: mmodelexport-v1alpha1.kb.io
  rules:
  - apiGroups:
    - modeldock.wutz.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modelexports
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-modeldock-wutz-dev-v1alpha1-modelartifact
  failurePolicy: Fail
  name: vmodelartifact-v1alpha1.kb.io
  rules:
  - apiGroups:
    - modeldock.wutz.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - modelartifacts
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-modeldock-wutz-dev-v1alpha1-modelexport
  failurePolicy: Fail
  name: vmodelexport-v1alpha1.kb.io
  rules:
  - apiGroups:
    - modeldock.wutz.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modelexports
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-modeldock-wutz-dev-v1alpha1-modelrepository
  failurePolicy: Fail
  name: vmodelrepository-v1alpha1.kb.io
  rules:
  - apiGroups:
    - modeldock.wutz.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modelrepositories
  sideEffects: None
