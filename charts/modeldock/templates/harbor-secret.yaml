{{- if .Values.harbor.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.harbor.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
type: Opaque
stringData:
  endpoint: {{ .Values.harbor.endpoint | quote }}
  registryHost: {{ .Values.harbor.registryHost | quote }}
  username: {{ .Values.harbor.username | quote }}
  password: {{ .Values.harbor.password | quote }}
  insecureSkipTLS: {{ .Values.harbor.insecureSkipTLS | quote }}
{{- end }}
