apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "modeldock.fullname" . }}-manager-role
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "persistentvolumeclaims", "pods", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["modeldock.wutz.dev"]
    resources: ["modelrepositories", "modelartifacts", "modelexports", "modelcaches"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["modeldock.wutz.dev"]
    resources: ["modelrepositories/status", "modelartifacts/status", "modelexports/status", "modelcaches/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["modeldock.wutz.dev"]
    resources: ["modelrepositories/finalizers", "modelartifacts/finalizers", "modelexports/finalizers", "modelcaches/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "modeldock.fullname" . }}-manager-rolebinding
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "modeldock.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "modeldock.fullname" . }}
    namespace: {{ .Release.Namespace }}
