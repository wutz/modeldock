apiVersion: v1
kind: Service
metadata:
  name: {{ include "modeldock.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "modeldock.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.harborWebhook.enabled }}
    - name: harbor-webhook
      port: {{ .Values.harborWebhook.port }}
      targetPort: harbor-webhook
    {{- end }}
    {{- if .Values.ui.enabled }}
    - name: catalog-ui
      port: {{ .Values.ui.port }}
      targetPort: catalog-ui
    {{- end }}
    {{- if .Values.webhooks.enabled }}
    - name: webhook
      port: 443
      targetPort: webhook
    {{- end }}
